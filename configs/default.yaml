# Default configuration. Override any key from the CLI, e.g.
#   sathealth prepare --set windows.size=128 --set dataset.spacecraft=[SMAP]
seed: 42
log_level: INFO

paths:
  raw_dir: data/raw/telemanom      # verified raw .npy files + labeled_anomalies.csv
  processed_dir: data/processed    # one sub-directory per config fingerprint
  runs_dir: runs/evaluations       # one sub-directory per detector + settings fingerprint

dataset:
  name: telemanom                  # NASA SMAP + MSL (Hundman et al., KDD 2018)
  spacecraft: [SMAP, MSL]
  channels: null                   # e.g. [A-1, P-1] for a quick run
  duplicate_policy: drop           # drop | first | union  (see docs/adr/0002)

download:
  manifest: telemanom.json         # pinned mirror + SHA-256 of every file
  max_workers: 8
  retries: 4
  timeout_s: 60
  backoff_s: 1.0

preprocess:
  scaler: robust                   # robust (median/IQR) | standard | none  (see docs/adr/0003)
  value_columns: [0]               # column 0 = telemetry value; 1.. = one-hot command flags
  val_fraction: 0.2                # chronological tail of the train series
  split_gap: 0
  min_scale: 1.0e-6

windows:
  size: 100
  stride: 1
  label_rule: any                  # any: window is anomalous if any step is | last: last step

validation:
  fail_on_error: true
  out_of_range_warn_fraction: 0.05
  max_anomaly_fraction: 0.3
  low_cardinality_max: 10

evaluation:                        # see docs/adr/0004-evaluation-protocol.md
  threshold: val_quantile          # val_quantile | val_sigma; fit on nominal validation scores
  quantile: 0.999                  # alarm rate we accept on held-out nominal data
  sigma: 4.0                       # used by val_sigma: mean + sigma * std
  min_threshold_rows: 50           # shorter validation tails fall back to train scores
  early_tolerance: 0               # steps before a labelled start that count as detection
  min_event_gap: 0                 # merge predicted runs separated by <= this many steps
  oracle_thresholds: 200           # candidates for the label-aware upper bound (reported only)
  bootstrap: 1000                  # resamples over channels for 95% confidence intervals
  exclude_subsets:                 # also report results without channels flagged by these
    - [constant_train]
    - [constant_train, nominal_out_of_range]

baselines:
  limit:
    margin: 0.05                   # widen [train min, train max] by 5% of its range
  iforest:
    window: 32
    n_estimators: 200
    max_samples: 256
