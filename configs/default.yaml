# Default configuration. Override any key from the CLI, e.g.
#   sathealth prepare --set windows.size=128 --set dataset.spacecraft=[SMAP]
seed: 42
log_level: INFO

paths:
  raw_dir: data/raw/telemanom      # verified raw .npy files + labeled_anomalies.csv
  processed_dir: data/processed    # one sub-directory per config fingerprint
  runs_dir: runs/evaluations       # one sub-directory per detector + settings fingerprint
  decisions_dir: runs/decisions    # one sub-directory per decision pipeline + fingerprint
  models_dir: runs/models          # cached, verified model weights for explanations
  explanations_dir: runs/explanations

dataset:
  name: telemanom                  # NASA SMAP + MSL (Hundman et al., KDD 2018)
  spacecraft: [SMAP, MSL]
  channels: null                   # e.g. [A-1, P-1] for a quick run
  duplicate_policy: drop           # drop | first | union  (see docs/adr/0002)

download:
  manifest: telemanom.json         # pinned mirror + SHA-256 of every file
  max_workers: 8
  retries: 4
  timeout_s: 60
  backoff_s: 1.0

preprocess:
  scaler: robust                   # robust (median/IQR) | standard | none  (see docs/adr/0003)
  value_columns: [0]               # column 0 = telemetry value; 1.. = one-hot command flags
  val_fraction: 0.2                # chronological tail of the train series
  split_gap: 0
  min_scale: 1.0e-6

windows:
  size: 100
  stride: 1
  label_rule: any                  # any: window is anomalous if any step is | last: last step

validation:
  fail_on_error: true
  out_of_range_warn_fraction: 0.05
  max_anomaly_fraction: 0.3
  low_cardinality_max: 10

evaluation:                        # see docs/adr/0004-evaluation-protocol.md
  threshold: val_quantile          # val_quantile | val_sigma; fit on nominal validation scores
  quantile: 0.999                  # alarm rate we accept on held-out nominal data
  sigma: 4.0                       # used by val_sigma: mean + sigma * std
  min_threshold_rows: 50           # shorter validation tails fall back to train scores
  early_tolerance: 0               # steps before a labelled start that count as detection
  min_event_gap: 0                 # merge predicted runs separated by <= this many steps
  oracle_thresholds: 200           # candidates for the label-aware upper bound (reported only)
  bootstrap: 1000                  # resamples over channels for 95% confidence intervals
  exclude_subsets:                 # also report results without channels flagged by these
    - [constant_train]
    - [constant_train, nominal_out_of_range]

baselines:
  limit:
    margin: 0.05                   # widen [train min, train max] by 5% of its range
  iforest:
    window: 32
    n_estimators: 200
    max_samples: 256

deep:                              # one model per channel, fit on train, early-stopped on val
  training:
    epochs: 35
    batch_size: 64
    learning_rate: 1.0e-3
    weight_decay: 0.0
    patience: 5                    # epochs without val-loss improvement before stopping
    min_delta: 1.0e-4
    grad_clip: 1.0
    device: cpu                    # cpu | mps | cuda | auto; only cpu is bit-for-bit reproducible
    threads: 1                     # per channel; 1 = identical results on any machine
  lstm:                            # Telemanom-style next-step forecaster (Hundman et al. 2018)
    window: 64
    hidden: 80
    layers: 2
    dropout: 0.3
    smoothing: 30                  # EWMA span over absolute forecast errors
  transformer:                     # bottlenecked Transformer autoencoder
    window: 64
    d_model: 32
    heads: 4
    layers: 2
    feedforward: 64
    latent: 16
    dropout: 0.1
    smoothing: 30

tracking:
  mlflow_uri: null                 # e.g. file:./mlruns (needs `uv sync --extra tracking`)
  experiment: sathealth

decision:                          # see docs/adr/0006-decision-layer.md (pre-registered)
  name: fused
  inputs: [lstm, transformer]      # detectors whose saved scores are combined
  calibration: evt                 # evt (POT/GPD tail) | ecdf | none (raw scores)
  tail_quantile: 0.95              # POT threshold u on validation scores
  max_surprise: 12.0               # cap on -log10 tail probability
  recalibrate_every: null          # e.g. 100: streaming recalibration (post-hoc variant)
  recalibrate_window: 2000         # recent non-alarm scores used as the nominal reference
  fusion: mean                     # mean | max | min of surprises
  threshold: hysteresis            # hysteresis (live) | ndt (Telemanom, batch)
  alarm_on: 3.0                    # enter alarm at surprise >= 3 (p <= 1e-3)
  alarm_off: 2.0                   # leave alarm below 2 (p > 1e-2)
  merge_gap: 10                    # merge alarm runs this many steps apart
  min_duration: 1
  prune: null                      # Telemanom pruning margin, e.g. 0.13 (batch)
  ndt_window: 2100
  ndt_step: 70
  severity_warning: 4.5
  severity_critical: 6.0
  point_margin: 0.05               # point type: value beyond train range ± 5%
  alarm_budget: 1.0                # false events per 1k steps we accept

explain:                           # see docs/adr/0007-explainability.md (pre-registered)
  onset_level: 1.0                 # onset = walk back from the alarm while surprise >= 1
  onset_lookback: 500
  horizon: 250                     # counterfactual rollout length (steps)
  band_level: 0.9                  # counterfactual band
  band_starts: 50                  # validation rollouts that calibrate the band
  ig_steps: 64                     # Integrated Gradients path steps
  verify_tolerance: 1.0e-4         # rebuilt model must reproduce saved validation scores
  llm: false                       # optional Claude rewording, kept only if grounded
  llm_model: claude-opus-5-5
  eval_channels_per_spacecraft: 5  # attribution and band evaluation channels (fixed rule)
  eval_injections: 20
  eval_spike: 3.0
  eval_min_effect: 0.05
  eval_deletion_fraction: 0.05
  eval_coverage_horizon: 100
