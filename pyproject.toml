[project]
name = "sathealth"
version = "0.4.0"
description = "Explainable AI for satellite health monitoring and early anomaly detection"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.5,<2",
    "torch>=2.5,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14,<4"]
llm = ["anthropic>=1,<2"]

[project.scripts]
sathealth = "sathealth.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx2>=2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

# CPU-only PyTorch wheels on Linux (CI): the default PyPI wheel pulls ~2 GB of CUDA libraries.
# macOS and Windows wheels on PyPI are already CPU/MPS builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sathealth"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PT", "RUF", "C4", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow math symbols (σ, ℝ, ×) in docstrings

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sathealth"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: requires the real NASA SMAP/MSL dataset under data/raw (run `sathealth download`)",
]

[tool.coverage.run]
source = ["sathealth"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
